 pipeline:
  name: terraform-gcp-pipeline
  identifier: terraform_gcp_pipeline

  # 🟢 YOUR HARNESS PROJECT
  projectIdentifier: terraformproject
  orgIdentifier: default

  properties:
    ci:
      codebase:
        # 🟢 YOUR GITHUB CONNECTOR
        connectorRef: gitep3

        # 🟢 YOUR GITHUB REPOSITORY
        repoName: Harness

        build:
          type: branch
          spec:
            branch: main

  variables:

    # 🟡 Choose apply or destroy when running the pipeline
    - name: tf_action
      type: String
      description: "Choose: apply or destroy"
      value: <+input>.allowedValues(apply,destroy)

    # 🟢 YOUR GCP PROJECT
    - name: gcp_project_id
      type: String
      value: lhs-507905

    # 🟢 YOUR GCP REGION
    - name: gcp_region
      type: String
      value: us-central1

    # 🟢 YOUR GCP ZONE
    - name: gcp_zone
      type: String
      value: us-central1-a

    # 🔴 YOU DON'T HAVE THIS YET
    # You must create a GCS bucket before running Terraform Init.
    - name: gcs_bucket_name
      type: String
      value: <+input>

  stages:

    - stage:
        name: terraform
        identifier: terraform
        description: "Run Terraform on GCP"
        type: CI

        spec:
          cloneCodebase: true

          platform:
            os: Linux
            arch: Amd64

          runtime:
            type: Cloud
            spec: {}

          execution:
            steps:

              # ==========================================
              # TERRAFORM INIT
              # ==========================================

              - step:
                  type: Run
                  name: Terraform Init
                  identifier: tf_init

                  spec:
                    shell: Sh

                    envVariables:

                      # 🟢 YOUR HARNESS SECRET
                      GOOGLE_CREDENTIALS: <+secrets.getValue("gcp_service_account")>

                      # 🟢 YOUR GCP PROJECT
                      GOOGLE_PROJECT: <+variable.gcp_project_id>

                      # 🟢 YOUR GCP REGION
                      GOOGLE_REGION: <+variable.gcp_region>

                      # 🟢 YOUR GCP ZONE
                      GOOGLE_ZONE: <+variable.gcp_zone>

                    command: |-
                      echo "======================================"
                      echo "Creating GCP credential file"
                      echo "======================================"

                      printf '%s' "$GOOGLE_CREDENTIALS" > /tmp/gcp-key.json

                      export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json

                      echo "GCP Project:"
                      echo "$GOOGLE_PROJECT"

                      echo "GCP Region:"
                      echo "$GOOGLE_REGION"

                      echo "GCP Zone:"
                      echo "$GOOGLE_ZONE"

                      echo "======================================"
                      echo "Terraform Init"
                      echo "======================================"

                      cd terraform

                      terraform init \
                        -backend-config="bucket=<+variable.gcs_bucket_name>" \
                        -backend-config="prefix=harness-demo"

              # ==========================================
              # TERRAFORM PLAN
              # ==========================================

              - step:
                  type: Run
                  name: Terraform Plan
                  identifier: tf_plan

                  spec:
                    shell: Sh

                    envVariables:

                      # 🟢 YOUR HARNESS SECRET
                      GOOGLE_CREDENTIALS: <+secrets.getValue("gcp_service_account")>

                      # 🟢 YOUR GCP PROJECT
                      GOOGLE_PROJECT: <+variable.gcp_project_id>

                      # 🟢 YOUR GCP REGION
                      GOOGLE_REGION: <+variable.gcp_region>

                      # 🟢 YOUR GCP ZONE
                      GOOGLE_ZONE: <+variable.gcp_zone>

                    command: |-
                      echo "======================================"
                      echo "Creating GCP credential file"
                      echo "======================================"

                      printf '%s' "$GOOGLE_CREDENTIALS" > /tmp/gcp-key.json

                      export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json

                      echo "======================================"
                      echo "Terraform Plan"
                      echo "======================================"

                      cd terraform

                      if [ "<+pipeline.variables.tf_action>" = "destroy" ]; then

                        echo "Planning Terraform DESTROY"

                        terraform plan -destroy -no-color

                      else

                        echo "Planning Terraform APPLY"

                        terraform plan -no-color

                      fi

              # ==========================================
              # TERRAFORM EXECUTE
              # ==========================================

              - step:
                  type: Run
                  name: Terraform Execute
                  identifier: tf_execute

                  spec:
                    shell: Sh

                    envVariables:

                      # 🟢 YOUR HARNESS SECRET
                      GOOGLE_CREDENTIALS: <+secrets.getValue("gcp_service_account")>

                      # 🟢 YOUR GCP PROJECT
                      GOOGLE_PROJECT: <+variable.gcp_project_id>

                      # 🟢 YOUR GCP REGION
                      GOOGLE_REGION: <+variable.gcp_region>

                      # 🟢 YOUR GCP ZONE
                      GOOGLE_ZONE: <+variable.gcp_zone>

                    command: |-
                      echo "======================================"
                      echo "Creating GCP credential file"
                      echo "======================================"

                      printf '%s' "$GOOGLE_CREDENTIALS" > /tmp/gcp-key.json

                      export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json

                      echo "======================================"
                      echo "Terraform Execute"
                      echo "======================================"

                      cd terraform

                      if [ "<+pipeline.variables.tf_action>" = "destroy" ]; then

                        echo "Destroying GCP infrastructure"

                        terraform destroy -auto-approve -no-color

                      else

                        echo "Creating GCP infrastructure"

                        terraform apply -auto-approve -no-color

                        echo "======================================"
                        echo "Terraform Outputs"
                        echo "======================================"

                        terraform output

                      fi